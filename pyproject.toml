[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "astroio"
version = "0.1.0"
description = "Frame-oriented IO for astronomy and image-sequence formats."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av",
    "numpy",
    "opencv-python",
    "OpenImageIO",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools]
packages = ["astroio"]

[tool.setuptools.package-dir]
astroio = "."
